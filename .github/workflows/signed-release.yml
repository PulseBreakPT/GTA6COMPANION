name: Signed Play release
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unique integer greater than the last Play upload'
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode upload key
        env:
          KEYSTORE: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure ATLAS_KEYSTORE_BASE64 first.'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/atlas-upload.jks"
      - name: Test and sign
        env:
          ATLAS_KEYSTORE: ${{ runner.temp }}/atlas-upload.jks
          ATLAS_STORE_PASSWORD: ${{ secrets.ATLAS_STORE_PASSWORD }}
          ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
          ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          chmod +x gradlew
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon :core:test :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Upload signed binaries
        uses: actions/upload-artifact@v4
        with:
          name: LeonidaAtlas-signed-release-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/atlas-upload.jks"
