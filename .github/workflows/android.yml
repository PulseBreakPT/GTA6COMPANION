name: Android · APK on every update
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: atlas-development-signing-v1
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate, test and build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease :app:assembleDebugAndroidTest :data:assembleDebugAndroidTest
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LeonidaAtlas-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: LeonidaAtlas-AAB-unsigned-${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-apks
          path: |
            app/build/outputs/apk/androidTest/debug/*.apk
            data/build/outputs/apk/androidTest/debug/*.apk
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            **/build/reports/
            **/build/test-results/
  device-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android journey and Room integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest :data:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/capture_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: store/screenshots/*.png
          if-no-files-found: error
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
